
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garantie.tn | Espace magasin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      margin: 0;
      padding: 30px 15px;
      color: #183b52;
    }
    .container {
      max-width: 550px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #00000010;
    }
    h1 { margin-top: 0; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 15px;
    }
    input { border: 1px solid #ddd; }
    button {
      border: 0;
      background: #183b52;
      color: white;
      cursor: pointer;
    }
    #message { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Espace magasin</h1>
    <p>Ajouter une facture PDF à un dossier de garantie.</p>

    <form id="invoice-form">
      <label for="warranty-id">ID du dossier de garantie</label>
      <input id="warranty-id" type="text" required
        placeholder="ID de la garantie">

      <label for="invoice-file">Facture PDF</label>
      <input id="invoice-file" type="file"
        accept="application/pdf,.pdf" required>

      <button type="submit">Envoyer la facture</button>
    </form>

    <p id="message"></p>
  </div>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.getElementById("invoice-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        message.textContent = "Veuillez vous connecter.";
        return;
      }

      const warrantyId =
        document.getElementById("warranty-id").value.trim();

      const file =
        document.getElementById("invoice-file").files[0];

      if (!file || file.type !== "application/pdf") {
        message.textContent = "Veuillez choisir un fichier PDF.";
        return;
      }

      if (file.size > 50 * 1024 * 1024) {
        message.textContent = "Le fichier dépasse 50 MB.";
        return;
      }

      message.textContent = "Envoi en cours...";

      try {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const filePath = `${warrantyId}/${crypto.randomUUID()}-${safeName}`;

        const { error: uploadError } = await supabase.storage
          .from("invoices")
          .upload(filePath, file, {
            contentType: "application/pdf",
            upsert: false
          });

        if (uploadError) throw uploadError;

        const { error: insertError } = await supabase
          .from("invoices")
          .insert({
            warranty_id: warrantyId,
            file_path: filePath,
            file_name: file.name
          });

        if (insertError) throw insertError;

        message.textContent = "Facture ajoutée avec succès !";
        form.reset();

      } catch (error) {
        message.textContent = "Erreur : " + error.message;
      }
    });
  </script>
</body>
</html>
